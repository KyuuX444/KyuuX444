<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes rotateHex {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes glowBorder {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .pulse-dot {
        transform-origin: 44px 34px;
        animation: pulseDot 2s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blinkCursor 0.9s infinite;
      }
      .rotate-accent {
        transform-origin: 740px 113px;
        animation: rotateHex 20s linear infinite;
      }
      .border-glow {
        animation: glowBorder 3s ease-in-out infinite;
      }
    </style>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="heroGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="210" rx="12" fill="url(#heroBg)"/>
  <rect width="850" height="210" rx="12" fill="url(#heroGrid)"/>
  <rect class="border-glow" x="1" y="1" width="848" height="208" rx="11" fill="none" stroke="url(#heroBorder)" stroke-width="1.2"/>

  <!-- Top Status Bar -->
  <g transform="translate(44, 34)">
    <circle class="pulse-dot" cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="1">
      SISTEM AKTIF // STATUS: MEMBANGUN &amp; BERKARYA
    </text>
    <line x1="330" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Name & Alias -->
  <text x="44" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Mommy Kyuu
  </text>

  <!-- Alias Tag -->
  <rect x="315" y="70" width="76" height="28" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
  <text x="353" y="89" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#60a5fa">
    S.d.y
  </text>

  <!-- Role Subtitle with Animated Cursor -->
  <text x="44" y="136" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="2">
    DEVELOPER / BUILDER
  </text>
  <rect class="cursor-blink" x="250" y="122" width="7" height="16" fill="#38bdf8"/>

  <!-- Bio Line in Indonesian -->
  <text x="44" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
    Membangun REST API, aplikasi web, bot otomatisasi, developer tools, dan software eksperimental.
  </text>

  <!-- Animated Holographic Geometric Accent -->
  <g class="rotate-accent">
    <polygon points="740,58 790,88 790,148 740,178 690,148 690,88" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="740,71 777,93 777,141 740,163 703,141 703,93" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  </g>
  <circle cx="740" cy="118" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M733 118 L738 123 L748 113" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
